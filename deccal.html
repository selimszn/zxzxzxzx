<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seloflix</title>
<link rel="icon" href="/favicon.ico">
<script>
  // Detect Discord: Activities run on *.discordsays.com and receive frame_id in the URL.
  window.IN_DISCORD = location.hostname.endsWith('discordsays.com') || new URLSearchParams(location.search).has('frame_id');
  window.ENDPOINTS = window.IN_DISCORD ? {
    api: '/.proxy/tmdb-api/3',
    img: '/.proxy/tmdb-img/t/p/',
    cine: '/.proxy/cinesrc',
    unpkg: '/.proxy/unpkg',
    gfonts: '/.proxy/gfonts'
  } : {
    api: 'https://api.themoviedb.org/3',
    img: 'https://image.tmdb.org/t/p/',
    cine: 'https://cinesrc.st',
    unpkg: 'https://unpkg.com',
    gfonts: 'https://fonts.googleapis.com'
  };
  const pre = document.createElement('link');
  pre.rel = 'preconnect';
  pre.href = window.ENDPOINTS.img;
  document.head.appendChild(pre);
</script>
<style>
:root{--bg:#000;--fg:#f5f5f7;--muted:#86868b;--tile:#1c1c1e;--glass:rgba(28,28,30,.72);--line:rgba(255,255,255,.12);--ease:cubic-bezier(.22,.61,.36,1);
--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
body.lock{overflow:hidden}
.pad{padding-left:clamp(18px,4vw,48px);padding-right:clamp(18px,4vw,48px)}

/* NAV */
.nav{position:fixed;top:0;left:0;right:0;z-index:20;height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 clamp(18px,4vw,48px);background:rgba(10,10,10,.6);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:1.05rem;letter-spacing:-.02em}
.sbtn{display:flex;align-items:center;gap:10px;height:32px;padding:0 14px;border-radius:16px;background:rgba(255,255,255,.08);color:var(--muted);font-size:.85rem;transition:background .2s}
.sbtn:hover{background:rgba(255,255,255,.14)}
.sbtn kbd{font:inherit;font-size:.7rem;border:1px solid var(--line);border-radius:5px;padding:0 5px}

/* HERO */
.hero{position:relative;height:92vh;min-height:520px;display:flex;align-items:flex-end;overflow:hidden}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center 25%;animation:drift 20s var(--ease) infinite alternate}
@keyframes drift{from{transform:scale(1)}to{transform:scale(1.07)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 4%,rgba(0,0,0,.4) 50%,transparent),linear-gradient(to right,rgba(0,0,0,.55),transparent 60%)}
.hero-copy{position:relative;z-index:2;max-width:720px;padding:0 clamp(18px,5vw,64px) clamp(48px,8vh,96px);animation:rise 1s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#a1a1a6}
.hero h1,.detail h1{font-size:clamp(2.6rem,7vw,5.6rem);font-weight:700;letter-spacing:-.04em;line-height:1;margin-top:12px}
.hero p{margin-top:16px;max-width:560px;color:#d2d2d7;font-weight:300;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 26px;margin-top:26px;border-radius:22px;background:var(--fg);color:#000;font-weight:600;transition:transform .2s var(--ease),opacity .2s}
.pill:hover{opacity:.88}.pill:active{transform:scale(.97)}
.pill svg{width:14px;height:14px}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 22px}
.chip{height:34px;padding:0 16px;border-radius:17px;background:rgba(255,255,255,.08);font-size:.85rem;color:#d2d2d7;transition:background .2s,color .2s}
.chip:hover{background:rgba(255,255,255,.16)}
.chip.on{background:var(--fg);color:#000}

/* BENTO */
.bento{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(200px,24vw,320px);grid-auto-flow:dense;gap:14px;padding:0 clamp(18px,4vw,48px) 96px}
.tile{position:relative;border-radius:22px;overflow:hidden;background:var(--tile);animation:fade .8s var(--ease) both}
@keyframes fade{from{opacity:0;transform:translateY(16px)}}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile.tall{grid-row:span 2}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.tile:hover img{transform:scale(1.05)}
.t-meta{position:absolute;left:0;right:0;bottom:0;padding:48px 18px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.t-meta b{display:block;font-size:1rem;font-weight:600;letter-spacing:-.01em}
.tile.big .t-meta b{font-size:clamp(1.3rem,2.6vw,2rem)}
.t-meta span{font-size:.78rem;color:#a1a1a6}
@media(max-width:720px){.bento{grid-template-columns:1fr 1fr;grid-auto-rows:240px;gap:10px}.tile.big{grid-column:span 2;grid-row:span 1}.tile.tall{grid-row:span 1}}

/* SEARCH OVERLAY */
.sx{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);opacity:0;visibility:hidden;transition:opacity .35s var(--ease),visibility .35s;overflow-y:auto}
.sx.on{opacity:1;visibility:visible}
.sx-in{max-width:1100px;margin:0 auto;padding:100px clamp(18px,4vw,48px) 80px}
#sq{width:100%;background:none;border:0;border-bottom:1px solid var(--line);outline:none;color:var(--fg);font:600 clamp(2rem,6vw,3.6rem)/1.1 var(--font);letter-spacing:-.03em;padding-bottom:14px}
#sq::placeholder{color:#3a3a3c}
.sr{margin-top:32px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:24px 18px}
.sr a{display:block}
.sr .ph{aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:var(--tile)}
.sr img{width:100%;height:100%;object-fit:cover;display:block}
.sr b{display:block;margin-top:10px;font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr span{font-size:.72rem;color:var(--muted)}

/* DETAIL & PLAYER */
.detail{position:relative;min-height:72vh;display:flex;align-items:flex-end;overflow:hidden}
.d-bg{position:absolute;inset:0;background-size:cover;background-position:center 20%}
.detail::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#000 3%,rgba(0,0,0,.55) 55%,rgba(0,0,0,.2)),linear-gradient(to right,rgba(0,0,0,.75),transparent 70%)}
.d-copy{position:relative;z-index:2;max-width:760px;padding:110px clamp(18px,5vw,64px) 44px;animation:rise 1s var(--ease) both}
.meta{margin-top:14px;color:#a1a1a6;font-size:.9rem}
.tag{margin-top:10px;font-style:italic;color:#d2d2d7}
.over{margin-top:16px;color:#d2d2d7;font-weight:300;line-height:1.55;max-width:620px}

.player-sec{max-width:1160px;margin:0 auto;padding:12px clamp(18px,4vw,48px) 16px}
.shell{aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#0a0a0c;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.85)}
.shell iframe{width:100%;height:100%;border:none;display:block}

.eps{margin-top:28px}
.seasons{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.seasons::-webkit-scrollbar{display:none}
.spill{flex-shrink:0;height:34px;padding:0 16px;border-radius:17px;background:rgba(255,255,255,.08);font-size:.85rem;font-weight:500;color:#d2d2d7;transition:background .2s,color .2s}
.spill:hover{background:rgba(255,255,255,.16)}
.spill.on{background:var(--fg);color:#000}
.eplist{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.ep{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.07);text-align:left;transition:background .2s}
.ep:hover{background:rgba(255,255,255,.14)}
.ep.on{background:rgba(255,255,255,.22)}
.ep i{font-style:normal;font-weight:600;font-size:.85rem;color:var(--muted);width:24px;flex-shrink:0}
.ep.on i{color:var(--fg)}
.ep span{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* WATCH PROVIDERS & SIMILAR */
.where{padding:48px clamp(18px,4vw,48px) 8px}
.where h2,.similar h2{font-size:1.6rem;font-weight:600;letter-spacing:-.02em;margin-bottom:22px}
.wgroup{margin-bottom:22px}
.wgroup h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600;margin-bottom:10px}
.logos{display:flex;flex-wrap:wrap;gap:12px}
.prov{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:14px;background:rgba(255,255,255,.07);transition:background .2s}
.prov:hover{background:rgba(255,255,255,.14)}
.prov img{width:36px;height:36px;border-radius:9px;object-fit:cover}
.prov span{font-size:.9rem}
.muted{color:var(--muted);font-size:.9rem;line-height:1.5}
.similar{padding-top:48px}
.similar .bento{padding-bottom:96px}
.state{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--muted)}
@media(max-width:600px){.shell{border-radius:12px}}
</style>
</head>
<body>
<nav class="nav">
  <a class="logo" data-link href="/">seloflix.</a>
  <button class="sbtn" id="sopen">Film veya dizi ara <kbd>/</kbd></button>
</nav>

<main id="view"></main>

<div class="sx" id="sx">
  <div class="sx-in">
    <input id="sq" type="text" placeholder="Film veya dizi ara" autocomplete="off" spellcheck="false">
    <div class="sr" id="sr"></div>
  </div>
</div>

<script>
const KEY = 'cae0d567f5b1d9f48e8b9be207a381ae';
const { api: API, img: IMG, cine: CINE } = window.ENDPOINTS;
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view = html => { $('#view').innerHTML = html; };

async function tmdb(path, params = {}) {
  const q = new URLSearchParams({ api_key: KEY, language: 'tr-TR', ...params });
  try { const r = await fetch(`${API}${path}?${q}`); return r.ok ? await r.json() : null; }
  catch { return null; }
}

const titleOf = d => d.title || d.name || '';
const yearOf = d => (d.release_date || d.first_air_date || '').slice(0, 4);
const kindOf = d => d.media_type || (d.title !== undefined ? 'movie' : 'tv');
const slugify = s => s.toLowerCase().replace(/ı/g, 'i').normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const linkOf = d => '/' + slugify(titleOf(d));

/* ROUTING */
let routeId = 0;
function navigate(path) {
  if (path !== location.pathname) history.pushState({}, '', path);
  window.scrollTo(0, 0);
  route();
}
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-link]');
  if (!a || e.metaKey || e.ctrlKey) return;
  e.preventDefault();
  closeSearch();
  navigate(a.getAttribute('href'));
});
window.addEventListener('popstate', route);

async function route() {
  closeSearch();
  const my = ++routeId;
  const slug = decodeURIComponent(location.pathname).replace(/^\/+|\/+$/g, '');
  if (!slug) return showHome();
  view('<div class="state"></div>');
  const ref = await resolve(slug);
  if (my !== routeId) return;
  ref ? showDetail(ref) : showMissing();
}

async function resolve(slug) {
  const m = slug.match(/^(.*)-(\d{4})$/);
  const d = await tmdb('/search/multi', { query: slug.replace(/-/g, ' '), include_adult: false });
  const hit = (d?.results || [])
    .filter(x => x.media_type === 'movie' || x.media_type === 'tv')
    .find(x => {
      const s = slugify(titleOf(x));
      return s === slug || (m && s === m[1] && yearOf(x) === m[2]);
    });
  return hit ? { id: hit.id, type: hit.media_type } : null;
}

/* GRID */
function renderGrid(items, sel = '#grid', big = true) {
  $(sel).innerHTML = items.slice(0, 13).map((d, i) => {
    const b = big && i === 0;
    const tall = big && (i === 3 || i === 8);
    const img = b ? d.backdrop_path : d.poster_path;
    if (!img) return '';
    const cls = 'tile' + (b ? ' big' : '') + (tall ? ' tall' : '');
    return `<a class="${cls}" data-link href="${linkOf(d)}" style="animation-delay:${i * 40}ms">
      <img loading="lazy" alt="" src="${IMG}${b ? 'w1280' : 'w500'}${img}">
      <div class="t-meta"><b>${h(titleOf(d))}</b><span>${yearOf(d)} · ${kindOf(d) === 'tv' ? 'Dizi' : 'Film'}</span></div>
    </a>`;
  }).join('');
}

/* HOME */
const GENRES = [
  { l: 'Tümü' },
  { l: 'Aksiyon', m: 28, t: 10759 },
  { l: 'Komedi', m: 35, t: 35 },
  { l: 'Dram', m: 18, t: 18 },
  { l: 'Bilim Kurgu', m: 878, t: 10765 },
  { l: 'Animasyon', m: 16, t: 16 },
  { l: 'Korku', m: 27, t: 9648 }
];
let trending = [];

async function showHome() {
  document.title = 'Seloflix';
  view(`<section class="hero" id="hero"></section>
    <div class="chips pad" id="chips">${GENRES.map((g, i) => `<button class="chip${i ? '' : ' on'}" data-i="${i}">${g.l}</button>`).join('')}</div>
    <div class="bento" id="grid"></div>`);
  $('#chips').onclick = e => {
    const b = e.target.closest('.chip'); if (!b) return;
    document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b));
    loadGenre(GENRES[b.dataset.i]);
  };
  const t = await tmdb('/trending/all/week');
  trending = (t?.results || []).filter(d => d.media_type !== 'person');
  const hero = trending.find(d => d.backdrop_path && d.overview);
  if (hero) $('#hero').innerHTML = `
    <div class="hero-img" style="background-image:url(${IMG}w1280${hero.backdrop_path})"></div>
    <div class="hero-copy">
      <div class="eyebrow">Bu hafta en çok izlenen · ${kindOf(hero) === 'tv' ? 'Dizi' : 'Film'}</div>
      <h1>${h(titleOf(hero))}</h1>
      <p>${h(hero.overview)}</p>
      <a class="pill" data-link href="${linkOf(hero)}">
        <svg viewBox="0 0 14 14" fill="currentColor"><path d="M2 1.2v11.6a.6.6 0 0 0 .9.5l9.4-5.8a.6.6 0 0 0 0-1L2.9.7a.6.6 0 0 0-.9.5Z"/></svg>
        Oynat
      </a>
    </div>`;
  renderGrid(trending);
}

async function loadGenre(g) {
  if (!g.m) return renderGrid(trending);
  const [m, t] = await Promise.all([
    tmdb('/discover/movie', { with_genres: g.m, sort_by: 'popularity.desc' }),
    tmdb('/discover/tv', { with_genres: g.t, sort_by: 'popularity.desc' })
  ]);
  const items = [
    ...(m?.results || []).map(d => ({ ...d, media_type: 'movie' })),
    ...(t?.results || []).map(d => ({ ...d, media_type: 'tv' }))
  ].filter(d => d.poster_path).sort((a, b) => b.popularity - a.popularity);
  renderGrid(items);
}

/* DETAIL & PLAYER */
const cur = { id: null, type: 'movie', season: 1, episode: 1, seasons: [] };

function loadFrame() {
  const frame = $('#frame');
  if (!frame) return;
  frame.src = cur.type === 'tv'
    ? `${CINE}/embed/tv/${cur.id}?s=${cur.season}&e=${cur.episode}`
    : `${CINE}/embed/movie/${cur.id}`;
}

function renderSeasons() {
  const box = $('#seasons');
  if (!box) return;
  box.innerHTML = cur.seasons.map(s =>
    `<button class="spill${s.season_number === cur.season ? ' on' : ''}" data-s="${s.season_number}">Sezon ${s.season_number}</button>`
  ).join('');
  box.onclick = e => {
    const b = e.target.closest('.spill');
    if (!b) return;
    cur.season = Number(b.dataset.s);
    cur.episode = 1;
    renderSeasons();
    renderEpisodes();
    loadFrame();
  };
}

async function renderEpisodes() {
  const box = $('#eplist');
  if (!box) return;
  box.innerHTML = '';
  const { id, season } = cur;
  const data = await tmdb(`/tv/${id}/season/${season}`);
  if (cur.id !== id || cur.season !== season || !$('#eplist')) return;
  const eps = data?.episodes || [];
  box.innerHTML = eps.map(ep =>
    `<button class="ep${ep.episode_number === cur.episode ? ' on' : ''}" data-e="${ep.episode_number}">
      <i>${ep.episode_number}</i>
      <span>${h(ep.name || `Bölüm ${ep.episode_number}`)}</span>
    </button>`
  ).join('');
  box.onclick = e => {
    const b = e.target.closest('.ep');
    if (!b) return;
    cur.episode = Number(b.dataset.e);
    renderEpisodes();
    loadFrame();
  };
}

async function showDetail({ id, type }) {
  const my = routeId;
  const d = await tmdb(`/${type}/${id}`, { append_to_response: 'watch/providers,similar' });
  if (my !== routeId) return;
  if (!d) return showMissing();

  const name = titleOf(d);
  const genres = (d.genres || []).map(g => g.name).join(' · ');
  const runtime = type === 'movie'
    ? (d.runtime ? `${d.runtime} dk` : '')
    : `${d.number_of_seasons} sezon · ${d.number_of_episodes} bölüm`;
  const tr = d['watch/providers']?.results?.TR;
  const groups = [['Abonelik', tr?.flatrate], ['Kiralama', tr?.rent], ['Satın alma', tr?.buy]].filter(([, a]) => a?.length);
  const similar = (d.similar?.results || []).filter(x => x.poster_path).map(x => ({ ...x, media_type: type }));

  const validSeasons = type === 'tv'
    ? (d.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0)
    : [];
  const seasons = type === 'tv'
    ? (validSeasons.length ? validSeasons : [{ season_number: 1 }])
    : [];
  const initialSeason = seasons.length ? seasons[0].season_number : 1;

  Object.assign(cur, { id, type, season: initialSeason, episode: 1, seasons });
  document.title = `${name} · Seloflix`;

  view(`
    <section class="detail">
      <div class="d-bg" style="background-image:url(${IMG}w1280${d.backdrop_path || d.poster_path})"></div>
      <div class="d-copy">
        <div class="eyebrow">${type === 'tv' ? 'Dizi' : 'Film'}${genres ? ' · ' + h(genres) : ''}</div>
        <h1>${h(name)}</h1>
        <div class="meta">${[yearOf(d), runtime, d.vote_average ? '★ ' + d.vote_average.toFixed(1) : ''].filter(Boolean).join(' · ')}</div>
        ${d.tagline ? `<p class="tag">${h(d.tagline)}</p>` : ''}
        <p class="over">${h(d.overview)}</p>
        <button class="pill" id="play-jump">
          <svg viewBox="0 0 14 14" fill="currentColor"><path d="M2 1.2v11.6a.6.6 0 0 0 .9.5l9.4-5.8a.6.6 0 0 0 0-1L2.9.7a.6.6 0 0 0-.9.5Z"/></svg>
          Oynat
        </button>
      </div>
    </section>

    <section class="player-sec" id="player-sec">
      <div class="shell">
        <iframe id="frame" allow="fullscreen; autoplay; picture-in-picture" allowfullscreen></iframe>
      </div>
      ${type === 'tv' ? `<div class="eps"><div class="seasons" id="seasons"></div><div class="eplist" id="eplist"></div></div>` : ''}
    </section>

    <section class="where pad">
      <h2>Türkiye'de nerede izlenir</h2>
      ${groups.length
        ? groups.map(([l, a]) => `<div class="wgroup"><h3>${l}</h3><div class="logos">${a.map(p =>
            `<a class="prov" href="${h(tr.link)}" target="_blank" rel="noopener"><img src="${IMG}w92${p.logo_path}" alt=""><span>${h(p.provider_name)}</span></a>`).join('')}</div></div>`).join('')
        : '<p class="muted">Türkiye için yayın bilgisi bulunamadı.</p>'}
      ${tr ? '<p class="muted">Bilgiler JustWatch aracılığıyla TMDB üzerinden alınmıştır.</p>' : ''}
    </section>
    ${similar.length ? `<section class="similar"><h2 class="pad">Benzer</h2><div class="bento" id="grid"></div></section>` : ''}
  `);

  $('#play-jump').onclick = () => $('#player-sec').scrollIntoView({ behavior: 'smooth', block: 'center' });
  loadFrame();

  if (type === 'tv') {
    renderSeasons();
    renderEpisodes();
  }
  if (similar.length) renderGrid(similar, '#grid', false);
}

function showMissing() {
  document.title = 'Bulunamadı · Seloflix';
  view(`<div class="state"><p>Bu sayfa bulunamadı.</p><a class="pill" data-link href="/">Ana sayfa</a></div>`);
}

/* SEARCH */
function openSearch() {
  $('#sx').classList.add('on');
  document.body.classList.add('lock');
  setTimeout(() => $('#sq').focus(), 50);
}
function closeSearch() {
  $('#sx').classList.remove('on');
  document.body.classList.remove('lock');
}
$('#sopen').onclick = openSearch;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeSearch();
  if (e.key === '/' && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
});
$('#sx').addEventListener('click', e => { if (e.target.id === 'sx') closeSearch(); });

let st;
$('#sq').addEventListener('input', e => {
  clearTimeout(st);
  const q = e.target.value.trim();
  if (!q) { $('#sr').innerHTML = ''; return; }
  st = setTimeout(async () => {
    const d = await tmdb('/search/multi', { query: q, include_adult: false });
    const items = (d?.results || []).filter(x => (x.media_type === 'movie' || x.media_type === 'tv') && x.poster_path).slice(0, 12);
    $('#sr').innerHTML = items.map(x => `
      <a data-link href="${linkOf(x)}">
        <div class="ph"><img loading="lazy" alt="" src="${IMG}w342${x.poster_path}"></div>
        <b>${h(titleOf(x))}</b><span>${yearOf(x)} · ${x.media_type === 'tv' ? 'Dizi' : 'Film'}</span>
      </a>`).join('') || '<p class="muted">Sonuç bulunamadı</p>';
  }, 260);
});

route();
</script>

      const discordSdk = new DiscordSDK('1567593177118937289');
