<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seloflix</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #050505;
      --fg: #ffffff;
      --muted: #8a8a8a;
      --muted2: #3a3a3a;
      --subtle: #131313;
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      overflow: hidden;
    }

    /* ── AMBIENT LIVING BACKGROUND ── */
    #ambient {
      position: fixed; inset: 0; z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.22;
      background: radial-gradient(circle, #ffffff 0%, transparent 70%);
      will-change: transform;
    }
    .blob.b1 { width: 520px; height: 520px; top: -12%; left: -8%; animation: drift1 11s ease-in-out infinite alternate; }
    .blob.b2 { width: 620px; height: 620px; bottom: -18%; right: -10%; animation: drift2 14s ease-in-out infinite alternate; }
    .blob.b3 { width: 440px; height: 440px; top: 38%; left: 58%; opacity: 0.16; animation: drift3 9s ease-in-out infinite alternate; }

    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(160px, 100px); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-140px, -90px); } }
    @keyframes drift3 { from { transform: translate(0,0) scale(1); } to { transform: translate(-110px, 130px) scale(1.2); } }

    /* ── NOISE ── */
    #noise {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      opacity: 0.05;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
      background-size: 180px 180px;
      animation: grain 8s steps(8) infinite;
      will-change: background-position;
    }

    @keyframes grain {
      0%   { background-position: 0 0; }
      12%  { background-position: -15px 8px; }
      24%  { background-position: 12px -10px; }
      36%  { background-position: -8px -14px; }
      48%  { background-position: 16px 6px; }
      60%  { background-position: -12px 12px; }
      72%  { background-position: 8px -8px; }
      84%  { background-position: -16px -4px; }
      100% { background-position: 0 0; }
    }

    /* ── APP ── */
    #app {
      position: fixed;
      inset: 0;
      z-index: 10;
      background: transparent;
      display: flex; flex-direction: column;
      overflow: hidden;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
    }
    #app.hidden { opacity: 0; pointer-events: none; transform: translateY(-10px) !important; }

    /* ── HEADER ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 2rem;
      padding: 2rem 2.4rem 1.4rem;
      flex-shrink: 0;
    }

    .wordmark {
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
      letter-spacing: -0.01em;
      color: var(--fg);
      flex-shrink: 0;
      opacity: 0;
      animation: fadeUp 0.7s var(--ease) 0.1s forwards;
    }

    .search-box {
      width: 100%; max-width: 380px;
      position: relative;
      opacity: 0;
      animation: fadeUp 0.7s var(--ease) 0.2s forwards;
    }

    .search-glow {
      position: relative;
      border-radius: 9px;
      padding: 1.5px;
      isolation: isolate;
      overflow: hidden;
    }
    .search-glow::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,0.65) 50%, transparent 70%);
      background-size: 260% 100%;
      animation: shimmer 3.6s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes shimmer {
      0%   { background-position: 160% 0; }
      50%  { background-position: -60% 0; }
      100% { background-position: -60% 0; }
    }

    #search-input {
      position: relative; z-index: 1;
      width: 100%;
      background: var(--subtle);
      border: none;
      border-radius: 8px;
      color: var(--fg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      font-size: 0.9rem;
      padding: 0.7rem 1rem;
      outline: none;
      transition: background 0.2s;
      caret-color: var(--fg);
    }
    #search-input::placeholder { color: var(--muted); }
    #search-input:focus { background: #161616; }

    #results {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: #101010;
      border: none;
      border-radius: 10px;
      overflow: hidden;
      max-height: 0; opacity: 0;
      transition: max-height 0.35s var(--ease), opacity 0.25s var(--ease);
      z-index: 40;
    }
    #results.open { max-height: 420px; opacity: 1; overflow-y: auto; }
    #results::-webkit-scrollbar { width: 3px; }
    #results::-webkit-scrollbar-thumb { background: #2a2a2a; }

    .result-item {
      display: flex; align-items: center; gap: 0.85rem;
      padding: 0.7rem 1rem;
      cursor: pointer;
      transition: background 0.15s;
    }
    .result-item:hover { background: #1c1c1c; }

    .result-thumb {
      width: 30px; height: 44px;
      object-fit: cover; border-radius: 3px;
      flex-shrink: 0; background: #181818;
    }
    .result-thumb.empty {
      display: flex; align-items: center; justify-content: center;
      color: #333; font-size: 0.5rem;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-title { font-size: 0.85rem; font-weight: 400; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .result-sub { font-size: 0.68rem; color: var(--muted); margin-top: 0.15rem; letter-spacing: 0.05em; text-transform: uppercase; }
    .badge {
      font-size: 0.58rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--muted);
      border-radius: 3px; padding: 0.12rem 0.35rem; flex-shrink: 0;
    }

    #search-status {
      font-size: 0.72rem; color: var(--muted);
      letter-spacing: 0.07em; text-align: right;
      flex-shrink: 0;
      min-width: 60px;
      opacity: 0; animation: fadeUp 0.7s var(--ease) 0.3s forwards;
    }

    /* ── ROWS ── */
    #rows-container {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.8rem 0 3rem;
      scrollbar-width: thin;
      scrollbar-color: #2a2a2a transparent;
    }
    #rows-container::-webkit-scrollbar { width: 6px; }
    #rows-container::-webkit-scrollbar-thumb { background: #202020; border-radius: 3px; }

    .row {
      margin-bottom: 2.4rem;
      opacity: 0;
      animation: fadeUp 0.6s var(--ease) forwards;
    }

    .row-title {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--fg);
      padding: 0 2.2rem;
      margin-bottom: 0.9rem;
    }

    .row-track {
      display: flex;
      gap: 1.1rem;
      overflow-x: auto;
      overflow-y: visible;
      padding: 10px 0 26px 2.2rem;
      scrollbar-width: none;
      -webkit-mask-image: linear-gradient(to right, black 92%, transparent 100%);
      mask-image: linear-gradient(to right, black 92%, transparent 100%);
    }
    .row-track::-webkit-scrollbar { display: none; }
    .row-track::after {
      content: '';
      flex: 0 0 2.2rem;
    }

    .card {
      flex: 0 0 152px;
      cursor: pointer;
      transform: translateY(0) scale(1);
      transition: transform 0.15s var(--ease);
      will-change: transform;
    }
    .card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      border-radius: 7px;
      display: block;
      background: #141414;
    }
    .card-title {
      margin-top: 0.55rem;
      font-size: 0.76rem;
      font-weight: 400;
      color: var(--fg);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-sub {
      font-size: 0.63rem;
      color: var(--muted);
      margin-top: 0.15rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .row-empty { padding: 0 2.2rem; font-size: 0.75rem; color: var(--muted2); }

    /* ── PLAYER VIEW ── */
    #view-player {
      position: fixed; inset: 0; z-index: 50;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 1.5rem 2rem 1.2rem;
      opacity: 0; transform: translateY(16px) scale(0.99); pointer-events: none;
      transition: opacity 0.5s var(--ease), transform 0.5s var(--ease);
      gap: 0;
    }
    #view-player.visible { opacity: 1; transform: translateY(0) scale(1); pointer-events: all; }

    .player-back {
      position: absolute; top: 1.8rem; left: 1.8rem;
      background: none; border: none; cursor: pointer;
      color: var(--muted); font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase;
      display: flex; align-items: center; gap: 0.4rem;
      padding: 0.4rem; transition: color 0.2s;
    }
    .player-back:hover { color: var(--fg); }
    .player-back svg { width: 13px; height: 13px; }

    .player-title {
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: clamp(1rem, 2.2vw, 1.4rem);
      letter-spacing: -0.01em;
      margin-bottom: 0.9rem;
      text-align: center;
      color: var(--fg);
      max-width: 860px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .player-shell {
      width: 100%; max-width: 900px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
    }

    #player-frame {
      width: 100%; height: 100%;
      border: none; display: block;
    }

    /* ── EPISODE PICKER ── */
    #ep-picker {
      width: 100%; max-width: 900px;
      margin-top: 0.9rem;
      opacity: 0;
      max-height: 0;
      overflow: hidden;
      transition: opacity 0.4s var(--ease), max-height 0.4s var(--ease), margin-top 0.4s var(--ease);
    }
    #ep-picker.visible {
      opacity: 1;
      max-height: 140px;
      margin-top: 0.9rem;
    }

    .ep-inner {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .ep-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .ep-label {
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      width: 52px;
      flex-shrink: 0;
    }

    .ep-scroll {
      display: flex;
      gap: 0.35rem;
      overflow-x: auto;
      padding-bottom: 2px;
      flex: 1;
      scrollbar-width: none;
    }
    .ep-scroll::-webkit-scrollbar { display: none; }

    .ep-btn {
      flex-shrink: 0;
      background: var(--subtle);
      border: none;
      border-radius: 5px;
      color: var(--muted);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.72rem;
      font-weight: 300;
      padding: 0.3rem 0.65rem;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .ep-btn:hover { background: #1e1e1e; color: var(--fg); }
    .ep-btn.active {
      color: #000;
      background: var(--fg);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div id="ambient">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
  </div>
  <div id="noise"></div>

  <div id="app">
    <div class="topbar">
      <div class="wordmark">seloflix.</div>
      <div class="search-box">
        <div class="search-glow">
          <input id="search-input" type="text" placeholder="Film/Dizi/Anime" autocomplete="off" spellcheck="false" />
        </div>
        <div id="results"></div>
      </div>
      <div id="search-status"></div>
    </div>
    <main id="rows-container"></main>
  </div>

  <div id="view-player">
    <button class="player-back" id="back-btn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M10 3L5 8l5 5"/>
      </svg>
      Geri
    </button>
    <div class="player-title" id="player-title"></div>
    <div class="player-shell">
      <iframe id="player-frame" frameborder="0" allow="fullscreen; autoplay; picture-in-picture"></iframe>
    </div>
    <div id="ep-picker">
      <div class="ep-inner">
        <div class="ep-row">
          <span class="ep-label">Sezon</span>
          <div class="ep-scroll" id="season-list"></div>
        </div>
        <div class="ep-row">
          <span class="ep-label">Bölüm</span>
          <div class="ep-scroll" id="episode-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ── ELEMENTS ── */
    const searchInput = document.getElementById('search-input');
    const resultsEl   = document.getElementById('results');
    const statusEl    = document.getElementById('search-status');
    const appEl       = document.getElementById('app');
    const rowsEl      = document.getElementById('rows-container');
    const viewPlayer  = document.getElementById('view-player');
    const playerFrame = document.getElementById('player-frame');
    const playerTitle = document.getElementById('player-title');
    const backBtn     = document.getElementById('back-btn');
    const epPicker    = document.getElementById('ep-picker');
    const seasonList  = document.getElementById('season-list');
    const episodeList = document.getElementById('episode-list');

    /* ── STATE ── */
    let currentImdbId = null;
    let currentSeason = 1;
    let currentEpisode = 1;
    let totalSeasons = 1;
    let episodeCounts = {};

    /* ── SEARCH ── */
    let debounce;

    searchInput.addEventListener('input', () => {
      clearTimeout(debounce);
      const q = searchInput.value.trim();
      if (!q) { closeResults(); statusEl.textContent = ''; return; }
      debounce = setTimeout(() => doSearch(q), 370);
    });

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-box')) closeResults();
    });

    async function doSearch(q) {
      statusEl.textContent = '👀';
      closeResults();
      try {
        const res  = await fetch(`https://www.omdbapi.com/?s=${encodeURIComponent(q)}&apikey=trilogy`);
        const data = await res.json();
        if (data.Response === 'False' || !data.Search) {
          statusEl.textContent = 'Yanlış yazdın';
          return;
        }
        statusEl.textContent = '';
        renderResults(data.Search);
      } catch {
        statusEl.textContent = 'hata';
      }
    }

    function renderResults(items) {
      resultsEl.innerHTML = '';
      items.forEach(item => {
        const isTv   = item.Type === 'series';
        const div    = document.createElement('div');
        div.className = 'result-item';
        const hasPoster = item.Poster && item.Poster !== 'N/A';
        div.innerHTML = `
          ${hasPoster
            ? `<img class="result-thumb" src="${item.Poster}" alt="" loading="lazy" />`
            : `<div class="result-thumb empty">—</div>`}
          <div class="result-info">
            <div class="result-title">${item.Title}</div>
            <div class="result-sub">${item.Year}</div>
          </div>
          <span class="badge">${isTv ? 'TV' : 'Film'}</span>
        `;
        div.addEventListener('click', () => openPlayer(item.imdbID, isTv, item.Title));
        const thumbImg = div.querySelector('img.result-thumb');
        if (thumbImg) {
          thumbImg.addEventListener('error', () => {
            thumbImg.outerHTML = '<div class="result-thumb empty">—</div>';
          }, { once: true });
        }
        resultsEl.appendChild(div);
      });
      resultsEl.classList.add('open');
    }

    function closeResults() { resultsEl.classList.remove('open'); }

    /* ── PLAYER ── */
    async function openPlayer(imdbId, isTv, title) {
      currentImdbId  = imdbId;
      currentSeason  = 1;
      currentEpisode = 1;
      episodeCounts  = {};

      playerTitle.textContent = title;
      closeResults();
      searchInput.value = '';
      appEl.classList.add('hidden');
      viewPlayer.classList.add('visible');

      if (isTv) {
        loadFrame(imdbId, 1, 1);
        epPicker.classList.add('visible');
        await loadSeriesInfo(imdbId);
      } else {
        const targetSrc = `https://vidcore.io/movie/${imdbId}?theme=ffffff&poster=false&sub=tr`;
        loadFrameWithDelayedSandbox(targetSrc);
        epPicker.classList.remove('visible');
      }
    }

    function loadFrame(imdbId, season, episode) {
      const targetSrc = `https://vidcore.io/tv/${imdbId}/${season}/${episode}?theme=ffffff&poster=false&sub=tr`;
      loadFrameWithDelayedSandbox(targetSrc);
    }

    // Gecikmeli Sandbox Uygulama Fonksiyonu
    let sandboxTimeout;
    function loadFrameWithDelayedSandbox(src) {
      clearTimeout(sandboxTimeout);
      // İlk yüklemede sandbox'ı tamamen kaldırıp video player'ın onayını alıyoruz
      playerFrame.removeAttribute('sandbox');
      playerFrame.src = src;

      // Player yüklendikten 3.5 saniye sonra gizlice sandbox'ı çakıyoruz
      sandboxTimeout = setTimeout(() => {
        playerFrame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-presentation');
      }, 3500);
    }

    /* ── EXTRA OMDB UTILITY FOR EPISODES ── */
    async function omdbFetch(params) {
      try {
        const res = await fetch(`https://www.omdbapi.com/?${params}&apikey=trilogy`);
        return await res.json();
      } catch {
        return { Response: 'False' };
      }
    }

    async function loadSeriesInfo(imdbId) {
      seasonList.innerHTML  = '<span style="font-size:0.7rem;color:#555">yükleniyor…</span>';
      episodeList.innerHTML = '';

      const data = await omdbFetch(`i=${imdbId}&type=series`);
      totalSeasons = parseInt(data.totalSeasons) || 1;

      const cap = Math.min(totalSeasons, 20);
      const fetches = Array.from({ length: cap }, (_, i) =>
        omdbFetch(`i=${imdbId}&Season=${i + 1}`).then(d => {
          episodeCounts[i + 1] = d.Episodes ? d.Episodes.length : 0;
        }).catch(() => { episodeCounts[i + 1] = 0; })
      );
      await Promise.all(fetches);

      renderSeasons(cap);
      renderEpisodes(1);
    }

    function renderSeasons(count) {
      seasonList.innerHTML = '';
      for (let s = 1; s <= count; s++) {
        const btn = document.createElement('button');
        btn.className = 'ep-btn' + (s === currentSeason ? ' active' : '');
        btn.textContent = `S${String(s).padStart(2, '0')}`;
        btn.addEventListener('click', () => {
          currentSeason  = s;
          currentEpisode = 1;
          document.querySelectorAll('#season-list .ep-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          renderEpisodes(s);
          loadFrame(currentImdbId, s, 1);
        });
        seasonList.appendChild(btn);
      }
    }

    function renderEpisodes(season) {
      episodeList.innerHTML = '';
      const count = episodeCounts[season] || 24;
      for (let e = 1; e <= count; e++) {
        const btn = document.createElement('button');
        btn.className = 'ep-btn' + (e === currentEpisode ? ' active' : '');
        btn.textContent = `E${String(e).padStart(2, '0')}`;
        btn.addEventListener('click', () => {
          currentEpisode = e;
          document.querySelectorAll('#episode-list .ep-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          loadFrame(currentImdbId, currentSeason, e);
        });
        episodeList.appendChild(btn);
      }
    }

    /* ── BACK ── */
    backBtn.addEventListener('click', () => {
      clearTimeout(sandboxTimeout);
      viewPlayer.classList.remove('visible');
      appEl.classList.remove('hidden');
      epPicker.classList.remove('visible');
      setTimeout(() => { playerFrame.src = ''; playerFrame.removeAttribute('sandbox'); }, 600);
    });

    /* ── HOME ROWS ── */
    const ROWS = [
      { label: 'Trend Şu An', titles: ['Stranger Things', 'The Boys', 'Wednesday', 'The Last of Us', 'House of the Dragon', 'Breaking Bad', 'Money Heist', 'Dark', 'Squid Game', 'The Witcher', 'Peaky Blinders', 'Chernobyl', 'Better Call Saul', 'Loki'] },
      { label: 'Aksiyon', titles: ['John Wick', 'Mad Max: Fury Road', 'The Dark Knight', 'Gladiator', 'Extraction', 'Top Gun: Maverick', 'Fast Five', 'Mission: Impossible - Fallout', 'Die Hard', 'The Raid', 'Kingsman: The Secret Service', 'Sicario', 'Edge of Tomorrow', 'Baby Driver'] },
      { label: 'Bilim Kurgu', titles: ['Inception', 'Interstellar', 'Dune', 'Blade Runner 2049', 'The Matrix', 'Arrival', 'Ex Machina', 'Edge of Tomorrow', 'Tenet', 'The Martian', 'Children of Men', 'District 9', 'Looper', 'Annihilation'] },
      { label: 'Komedi', titles: ['The Grand Budapest Hotel', 'Superbad', 'Brooklyn Nine-Nine', 'The Office', 'Parks and Recreation', 'Deadpool', '21 Jump Street', 'Ted', 'The Hangover', 'Knives Out', 'Game Night', 'Booksmart', 'Step Brothers', 'Zombieland'] },
      { label: 'Efsaneler', titles: ['The Godfather', 'Pulp Fiction', 'Fight Club', 'The Shawshank Redemption', 'Goodfellas', 'Se7en', 'The Departed', 'Forrest Gump', 'The Green Mile', 'American History X', 'Whiplash', 'No Country for Old Men', 'There Will Be Blood', 'Heat'] },
      { label: 'Animasyon', titles: ['Spider-Man: Into the Spider-Verse', 'Spirited Away', 'Coco', 'Inside Out', 'The Lion King', 'How to Train Your Dragon', 'Arcane', 'Your Name', 'Zootopia', 'Up', 'Toy Story', 'WALL-E', 'Ratatouille', 'The Incredibles'] }
    ];

    async function buildRows() {
      for (let i = 0; i < ROWS.length; i++) {
        const rowDef = ROWS[i];
        const rowEl = document.createElement('div');
        rowEl.className = 'row';
        rowEl.style.animationDelay = `${i * 0.06}s`;
        rowEl.innerHTML = `
          <div class="row-title">${rowDef.label}</div>
          <div class="row-track" id="track-${i}"></div>
        `;
        rowsEl.appendChild(rowEl);

        const track = rowEl.querySelector('.row-track');

        const items = await Promise.all(
          rowDef.titles.map(t => omdbFetch(`t=${encodeURIComponent(t)}`).catch(() => ({ Response: 'False' })))
        );

        const valid = items.filter(d => d && d.Response !== 'False' && d.Poster && d.Poster !== 'N/A');

        if (!valid.length) {
          track.innerHTML = '<div class="row-empty">yüklenemedi</div>';
          continue;
        }

        valid.forEach(d => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${d.Poster}" alt="${d.Title}" loading="lazy" />
            <div class="card-title">${d.Title}</div>
            <div class="card-sub">${d.Year}${d.Type === 'series' ? ' · Dizi' : ''}</div>
          `;
          card.addEventListener('click', () => openPlayer(d.imdbID, d.Type === 'series', d.Title));
          const img = card.querySelector('img');
          img.addEventListener('error', () => card.remove(), { once: true });
          track.appendChild(card);
        });

        attachFisheye(track);
      }
    }

    /* ── INVERSED FISHEYE ROW EFFECT ── */
    function attachFisheye(track) {
      let raf = null;
      const maxDist   = 240;   // px falloff radius
      const minScale  = 0.78;  // scale of the card right under the cursor
      const maxOffset = 18;    // px it sinks down near the cursor

      track.addEventListener('mousemove', (e) => {
        if (raf) return;
        raf = requestAnimationFrame(() => {
          raf = null;
          const cards = track.children;
          for (let i = 0; i < cards.length; i++) {
            const card = cards[i];
            const rect = card.getBoundingClientRect();
            const center = rect.left + rect.width / 2;
            const dist = Math.abs(e.clientX - center);
            const t = Math.min(dist / maxDist, 1); // 0 = right under cursor, 1 = far away
            const scale = minScale + t * (1 - minScale);
            const offsetY = (1 - t) * maxOffset;
            card.style.transform = `translateY(${offsetY}px) scale(${scale})`;
          }
        });
      });

      track.addEventListener('mouseleave', () => {
        const cards = track.children;
        for (let i = 0; i < cards.length; i++) {
          cards[i].style.transform = 'translateY(0) scale(1)';
        }
      });
    }

    buildRows();
  </script>
