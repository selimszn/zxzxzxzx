<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Seloflix</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0a0a0a; --fg:#fff; --muted:#8a8a8a; --card:#151515; }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:var(--bg); color:var(--fg); font-family:'DM Sans',sans-serif; font-weight:300; }
  button { font-family:inherit; }

  .topbar { display:flex; align-items:center; justify-content:space-between; gap:1.5rem; padding:1.5rem 2rem; position:sticky; top:0; background:var(--bg); z-index:20; }
  .wordmark { font-weight:700; font-size:1.3rem; }
  .search-box { position:relative; width:100%; max-width:360px; }
  #search-input { width:100%; background:var(--card); border:1px solid #222; border-radius:8px; color:var(--fg); font:inherit; font-size:.9rem; padding:.65rem 1rem; outline:none; }
  #search-input:focus { border-color:#444; }
  #results { position:absolute; top:calc(100% + 6px); left:0; right:0; background:#111; border:1px solid #222; border-radius:10px; max-height:380px; overflow-y:auto; display:none; }
  #results.open { display:block; }
  .result-item { display:flex; align-items:center; gap:.8rem; padding:.6rem .9rem; cursor:pointer; }
  .result-item:hover { background:#1c1c1c; }
  .result-item img, .result-item .ph { width:30px; height:44px; border-radius:3px; object-fit:cover; background:#1c1c1c; flex-shrink:0; }
  .result-info { flex:1; min-width:0; }
  .result-title { font-size:.85rem; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .result-sub, .card-sub { font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:.15rem; }
  .empty { padding:1rem; font-size:.8rem; color:var(--muted); }

  main { padding:.5rem 0 3rem; }
  .row { margin-bottom:2rem; }
  .row-title { font-size:.8rem; font-weight:500; letter-spacing:.08em; text-transform:uppercase; padding:0 2rem; margin-bottom:.8rem; }
  .row-track { display:flex; gap:1rem; overflow-x:auto; padding:0 2rem; scrollbar-width:none; }
  .row-track::-webkit-scrollbar { display:none; }
  .card { flex:0 0 150px; cursor:pointer; }
  .card img { width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:6px; display:block; background:var(--card); }
  .card:hover img { opacity:.85; }
  .card-title { margin-top:.5rem; font-size:.78rem; font-weight:400; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  #view-player { position:fixed; inset:0; z-index:50; background:var(--bg); display:none; flex-direction:column; align-items:center; justify-content:center; padding:1.5rem; gap:.9rem; }
  #view-player.visible { display:flex; }
  .player-back { position:absolute; top:1.2rem; left:1.5rem; background:none; border:none; color:var(--muted); cursor:pointer; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; }
  .player-back:hover { color:var(--fg); }
  .player-title { font-weight:500; font-size:1.2rem; max-width:900px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-shell { width:100%; max-width:900px; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  #player-frame { width:100%; height:100%; border:none; display:block; }

  #ep-picker { width:100%; max-width:900px; display:none; flex-direction:column; gap:.5rem; }
  #ep-picker.visible { display:flex; }
  .ep-row { display:flex; align-items:center; gap:.6rem; }
  .ep-label { font-size:.65rem; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); width:50px; flex-shrink:0; }
  .ep-scroll { display:flex; gap:.35rem; overflow-x:auto; flex:1; scrollbar-width:none; }
  .ep-scroll::-webkit-scrollbar { display:none; }
  .ep-btn { flex-shrink:0; background:var(--card); border:none; border-radius:5px; color:var(--muted); font-size:.72rem; padding:.3rem .65rem; cursor:pointer; }
  .ep-btn:hover { color:var(--fg); }
  .ep-btn.active { background:var(--fg); color:#000; }
</style>
</head>
<body>
  <div id="app">
    <div class="topbar">
      <div class="wordmark">seloflix.</div>
      <div class="search-box">
        <input id="search-input" type="text" placeholder="Film / Dizi" autocomplete="off" spellcheck="false" />
        <div id="results"></div>
      </div>
    </div>
    <main id="rows"></main>
  </div>

  <div id="view-player">
    <button class="player-back" id="back-btn">← Geri</button>
    <div class="player-title" id="player-title"></div>
    <div class="player-shell"><iframe id="player-frame" allow="fullscreen; autoplay; picture-in-picture"></iframe></div>
    <div id="ep-picker">
      <div class="ep-row"><span class="ep-label">Sezon</span><div class="ep-scroll" id="season-list"></div></div>
      <div class="ep-row"><span class="ep-label">Bölüm</span><div class="ep-scroll" id="episode-list"></div></div>
    </div>
  </div>

<script>
  const KEY = 'cae0d567f5b1d9f48e8b9be207a381ae';
  const API = 'https://api.themoviedb.org/3';
  const IMG = 'https://image.tmdb.org/t/p/w342';
  const PARAMS = '?sub=tr&controls=0&autoplay=1';

  const $ = id => document.getElementById(id);
  const searchInput = $('search-input'), resultsEl = $('results'), appEl = $('app'), rowsEl = $('rows');
  const viewPlayer = $('view-player'), frame = $('player-frame'), epPicker = $('ep-picker');
  const seasonList = $('season-list'), episodeList = $('episode-list');

  let cur = { id: null, season: 1, episode: 1, seasons: [] };

  async function tmdb(path, params = '') {
    try {
      const r = await fetch(`${API}${path}?api_key=${KEY}&language=tr-TR${params}`);
      return await r.json();
    } catch { return {}; }
  }

  const isTv = d => (d.media_type || d._type) === 'tv';
  const titleOf = d => d.title || d.name || '';
  const yearOf = d => (d.release_date || d.first_air_date || '').slice(0, 4);

  /* ── SEARCH ── */
  let debounce;
  searchInput.addEventListener('input', () => {
    clearTimeout(debounce);
    const q = searchInput.value.trim();
    if (!q) return resultsEl.classList.remove('open');
    debounce = setTimeout(() => doSearch(q), 350);
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search-box')) resultsEl.classList.remove('open'); });

  async function doSearch(q) {
    const data = await tmdb('/search/multi', `&query=${encodeURIComponent(q)}`);
    const items = (data.results || []).filter(d => d.media_type === 'movie' || d.media_type === 'tv').slice(0, 10);
    resultsEl.innerHTML = '';
    if (!items.length) resultsEl.innerHTML = '<div class="empty">Sonuç yok</div>';
    items.forEach(d => {
      const el = document.createElement('div');
      el.className = 'result-item';
      el.innerHTML = d.poster_path ? `<img src="${IMG}${d.poster_path}" alt="">` : '<div class="ph"></div>';
      const info = document.createElement('div');
      info.className = 'result-info';
      info.innerHTML = '<div class="result-title"></div><div class="result-sub"></div>';
      info.firstChild.textContent = titleOf(d);
      info.lastChild.textContent = `${yearOf(d)} · ${isTv(d) ? 'Dizi' : 'Film'}`;
      el.appendChild(info);
      el.addEventListener('click', () => openPlayer(d));
      resultsEl.appendChild(el);
    });
    resultsEl.classList.add('open');
  }

  /* ── PLAYER ── */
  function loadFrame() {
    const base = 'https://vidsrc.sbs/embed';
    frame.src = isTv(cur.item)
      ? `${base}/tv/${cur.id}/${cur.season}/${cur.episode}${PARAMS}`
      : `${base}/movie/${cur.id}${PARAMS}`;
  }

  async function openPlayer(d) {
    const tv = isTv(d);
    cur = { id: d.id, item: d, season: 1, episode: 1, seasons: [] };
    $('player-title').textContent = titleOf(d);
    resultsEl.classList.remove('open');
    searchInput.value = '';
    appEl.style.display = 'none';
    viewPlayer.classList.add('visible');
    epPicker.classList.toggle('visible', tv);
    loadFrame();
    if (tv) {
      const info = await tmdb(`/tv/${d.id}`);
      cur.seasons = (info.seasons || []).filter(s => s.season_number > 0 && s.episode_count > 0);
      if (!cur.seasons.length) cur.seasons = [{ season_number: 1, episode_count: 24 }];
      cur.season = cur.seasons[0].season_number;
      renderSeasons();
      renderEpisodes();
    }
  }

  function makeBtn(label, active, onClick) {
    const b = document.createElement('button');
    b.className = 'ep-btn' + (active ? ' active' : '');
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  function renderSeasons() {
    seasonList.innerHTML = '';
    cur.seasons.forEach(s => {
      seasonList.appendChild(makeBtn(`S${String(s.season_number).padStart(2, '0')}`, s.season_number === cur.season, () => {
        cur.season = s.season_number; cur.episode = 1;
        renderSeasons(); renderEpisodes(); loadFrame();
      }));
    });
  }

  function renderEpisodes() {
    episodeList.innerHTML = '';
    const s = cur.seasons.find(x => x.season_number === cur.season);
    for (let e = 1; e <= (s ? s.episode_count : 24); e++) {
      episodeList.appendChild(makeBtn(`E${String(e).padStart(2, '0')}`, e === cur.episode, () => {
        cur.episode = e; renderEpisodes(); loadFrame();
      }));
    }
  }

  $('back-btn').addEventListener('click', () => {
    viewPlayer.classList.remove('visible');
    appEl.style.display = '';
    frame.src = '';
  });

  /* ── HOME ROWS ── */
  const ROWS = [
    { label: 'Trend Şu An',  path: '/trending/all/week' },
    { label: 'Popüler Filmler', path: '/movie/popular', type: 'movie' },
    { label: 'Popüler Diziler', path: '/tv/popular', type: 'tv' },
    { label: 'Aksiyon', path: '/discover/movie', extra: '&with_genres=28&sort_by=popularity.desc', type: 'movie' },
    { label: 'Bilim Kurgu', path: '/discover/movie', extra: '&with_genres=878&sort_by=popularity.desc', type: 'movie' },
    { label: 'Komedi', path: '/discover/movie', extra: '&with_genres=35&sort_by=popularity.desc', type: 'movie' },
    { label: 'Animasyon', path: '/discover/movie', extra: '&with_genres=16&sort_by=popularity.desc', type: 'movie' },
    { label: 'En Yüksek Puanlı', path: '/movie/top_rated', type: 'movie' }
  ];

  async function buildRows() {
    const all = await Promise.all(ROWS.map(r => tmdb(r.path, r.extra || '')));
    ROWS.forEach((r, i) => {
      const items = (all[i].results || []).filter(d => d.poster_path && (d.media_type ? d.media_type !== 'person' : true));
      if (!items.length) return;
      const row = document.createElement('section');
      row.className = 'row';
      row.innerHTML = '<div class="row-title"></div><div class="row-track"></div>';
      row.firstChild.textContent = r.label;
      const track = row.lastChild;
      items.forEach(d => {
        if (r.type) d._type = r.type;
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `<img src="${IMG}${d.poster_path}" alt="" loading="lazy"><div class="card-title"></div><div class="card-sub"></div>`;
        card.querySelector('.card-title').textContent = titleOf(d);
        card.querySelector('.card-sub').textContent = yearOf(d) + (isTv(d) ? ' · Dizi' : '');
        card.addEventListener('click', () => openPlayer(d));
        track.appendChild(card);
      });
      rowsEl.appendChild(row);
    });
  }
  buildRows();
</script>
</body>
</html>
