<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Player - Channel 289</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background-color: #1e293b;
      padding: 0.75rem 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .title {
      font-weight: 600;
      font-size: 1rem;
      color: #38bdf8;
    }

    .container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .main-player {
      flex: 1;
      background-color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100vh;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">IPTV Direct Player — Channel ID #289</div>
  </header>

  <div class="container">
    <div class="main-player">
      <video id="video" controls autoplay></video>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    
    // Direct stream link constructed specifically for channel 289
    const directStreamUrl = "http://85st63.3074618.xyz:8080/live/szr.8156/VxMKL2LmSL/289.m3u8";

    function playStream(rawUrl) {
      const proxiedStreamUrl = `/api/proxy?url=${encodeURIComponent(rawUrl)}`;

      if (Hls.isSupported()) {
        const hls = new Hls({
          xhrSetup: function(xhr, url) {
            if (!url.startsWith('/api/proxy') && !url.startsWith('http')) {
              const absoluteUrl = new URL(url, window.location.href).href;
              xhr.open('GET', `/api/proxy?url=${encodeURIComponent(absoluteUrl)}`, true);
            }
          }
        });
        hls.loadSource(proxiedStreamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            switch (data.type) {
              case Hls.ErrorTypes.NETWORK_ERROR:
                hls.startLoad();
                break;
              case Hls.ErrorTypes.MEDIA_ERROR:
                hls.recoverMediaError();
                break;
              default:
                hls.destroy();
                break;
            }
          }
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = proxiedStreamUrl;
        video.play();
      }
    }

    // Immediately play channel 289 when the page loads
    window.onload = () => playStream(directStreamUrl);
  </script>
</body>
</html>
